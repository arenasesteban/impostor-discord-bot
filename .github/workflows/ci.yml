name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-unit:
    name: Quality & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy src/

      - name: Unit tests
        run: pytest -m "not integration"

  integration:
  name: Integration Tests
  needs: quality-unit
  runs-on: ubuntu-24.04
  timeout-minutes: 15

  services:
    postgres:
      image: postgres:18-bookworm
      env:
        POSTGRES_DB: impostor_ci
        POSTGRES_USER: impostor_ci
        POSTGRES_PASSWORD: impostor_ci
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U impostor_ci -d impostor_ci"
        --health-interval 5s
        --health-timeout 5s
        --health-retries 10

  env:
    TEST_DATABASE_URL: >-
      postgresql+asyncpg://impostor_ci:impostor_ci@localhost:5432/impostor_ci
    ENVIRONMENT: test
    LOG_LEVEL: WARNING

  steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12.13"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: python -m pip install -r requirements-dev.txt

    - name: Integration tests
      run: pytest -m integration
